<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Browser App</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body { font-family: sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; }
    .toolbar { display: flex; gap: 8px; padding: 8px; background: #f0f0f0; border-bottom: 1px solid #ccc; }
    input { flex: 1; padding: 8px; font-size: 14px; border: 1px solid #ccc; border-radius: 4px; }
    button { padding: 8px 16px; font-size: 14px; cursor: pointer; }
    iframe { flex: 1; border: none; width: 100%; height: 100%; }
  </style>
</head>
<body>

  <!-- Browser Controls -->
  <div class="toolbar">
    <input type="text" id="urlInput" placeholder="Enter a URL (e.g. https://wikipedia.org)">
    <button onclick="navigate()">Go</button>
  </div>

  <!-- Web View Frame -->
  <iframe id="webFrame" src="https://wikipedia.org"></iframe>

  <script>
    function navigate() {
      let url = document.getElementById('urlInput').value;
      if (!url.startsWith('http://') && !url.startsWith('https://')) {
        url = 'https://' + url;
      }
      document.getElementById('webFrame').src = url;
    }

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</body>
</html>
